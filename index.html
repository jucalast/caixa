<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Caixa — Planejamento financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23b8f34a'/%3E%3Crect x='6.5' y='17' width='5' height='8.5' rx='2' fill='%230c1a03' opacity='.55'/%3E%3Crect x='13.5' y='12' width='5' height='13.5' rx='2' fill='%230c1a03' opacity='.8'/%3E%3Crect x='20.5' y='6.5' width='5' height='19' rx='2' fill='%230c1a03'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#060606; --surface-base:#121212; --surface-raised:#1d1d1d; --card:#0b0b0b; --hover:rgba(255,255,255,.07);
  --text:#f4f4f4; --text-subtle:#a8a8a8; --text-muted:#7c7c7c;
  --accent:#b8f34a; --on-accent:#0c1a03; --lav:#b4a8f6; --on-lav:#1a1438;
  --primary:#b8f34a; --primary-soft:rgba(184,243,74,.14); --primary-border:rgba(184,243,74,.4);
  --ok:#8fe05a; --warn:#f5b73b; --danger:#ff6b63; --info:#60a5fa;
  --alert-bg:rgba(255,107,99,.15); --ok-bg:rgba(143,224,90,.14); --warn-bg:rgba(245,183,59,.14);
  --r-md:12px; --r-lg:16px; --r-xl:24px; --r-full:9999px;
  /* SF Pro nos aparelhos Apple (via -apple-system); Inter, a mais próxima, onde a SF não existe */
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display',Inter,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --mono:'SF Mono',ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root[data-theme="light"]{
  --bg:#f4f4f5; --surface-base:#f0f0f1; --surface-raised:#e4e4e4; --card:#fff; --hover:rgba(0,0,0,.06);
  --text:#181818; --text-subtle:#5c5c5c; --text-muted:#8a8a8a;
  --primary:#3f6212; --primary-soft:rgba(63,98,18,.12); --primary-border:rgba(63,98,18,.38);
  --ok:#15924f; --warn:#b45309; --danger:#dc2626; --info:#2563eb;
  --alert-bg:rgba(220,38,38,.1); --ok-bg:rgba(21,146,79,.12); --warn-bg:rgba(180,83,9,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh;font-size:15px}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ── Marca ── */
.marca{display:inline-flex;align-items:center;color:var(--text);line-height:1;user-select:none;white-space:nowrap}
.marca svg{flex-shrink:0;display:block}
.marca span{font-weight:600;letter-spacing:-.025em}
.marca.lg{font-size:34px;gap:14px}.marca.lg svg{width:56px;height:56px;filter:drop-shadow(0 10px 24px rgba(184,243,74,.3))}
.marca.sm{font-size:19px;gap:9px}.marca.sm svg{width:28px;height:28px}

/* ── Login ── */
.auth{position:fixed;inset:0;display:flex;justify-content:center;padding:16px;overflow-y:auto;background:var(--bg);z-index:50}
.auth .stack{margin:auto 0;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.auth .brand{display:flex;justify-content:center;animation:rise .4s var(--ease)}
.card{background:var(--card);border-radius:var(--r-xl);overflow:hidden;animation:rise .4s var(--ease)}
.card.pad{padding:16px}
.nav{display:flex;gap:6px;padding:4px;margin:16px 16px 12px;background:var(--surface-base);border-radius:var(--r-lg)}
.nav button{flex:1;height:32px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-muted);font-size:13px;font-weight:500;transition:background .2s var(--ease),color .2s var(--ease);white-space:nowrap;padding:0 12px}
.nav button:hover{color:var(--text)}
.nav button.on{background:var(--surface-raised);color:var(--text);font-weight:600}
.body{display:flex;flex-direction:column;gap:10px;padding:0 16px 16px}
.lbl{font-size:13px;font-weight:500;color:var(--text-muted)}
.field{display:flex;flex-direction:column;gap:4px}
.input{width:100%;height:38px;padding:0 12px;border:0;border-radius:var(--r-md);background:var(--surface-base);outline:2px solid transparent;transition:outline-color .2s var(--ease),background .2s var(--ease)}
.input.ico{padding-left:38px}
.input:hover{background:var(--hover)}.input:focus{outline-color:var(--primary-border)}
.input::placeholder{color:var(--text-subtle)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-subtle) 50%),linear-gradient(135deg,var(--text-subtle) 50%,transparent 50%);background-position:calc(100% - 18px) 16px,calc(100% - 13px) 16px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
select.input option{background:var(--surface-raised);color:var(--text)}
.wrap{position:relative;display:flex;align-items:center}
.wrap>svg{position:absolute;left:12px;width:16px;height:16px;color:var(--text-subtle);pointer-events:none}
.hint{font-size:12px;color:var(--text-subtle);line-height:1.4}
.err{padding:10px 12px;border-radius:var(--r-md);background:var(--alert-bg);color:var(--danger);font-size:13px}
.btn{height:40px;border:0;border-radius:var(--r-md);background:var(--text);color:var(--bg);font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.btn:hover{opacity:.88}.btn:active{transform:scale(.99)}
.btn.ghost{background:var(--surface-raised);color:var(--text)}
.btn.danger{background:var(--alert-bg);color:var(--danger)}
.btn.sm{height:32px;font-size:13px;padding:0 12px}
.link{background:none;border:0;color:var(--text-muted);font-size:13px;padding:6px}
.link:hover{color:var(--text)}

/* ── App ── */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg)}
.top .nav{margin:0;flex:0 1 auto;overflow-x:auto}
.top .sp{flex:1}
.icon-btn{width:34px;height:34px;border:0;border-radius:var(--r-md);background:var(--surface-raised);display:flex;align-items:center;justify-content:center;color:var(--text-subtle)}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:16px;height:16px}
main{max-width:1080px;margin:0 auto;padding:8px 16px 96px;display:flex;flex-direction:column;gap:16px;animation:rise .35s var(--ease)}
.hero{display:flex;align-items:center;gap:12px;padding:16px 16px 4px}
.hero-ico{width:40px;height:40px;border-radius:var(--r-md);background:var(--surface-raised);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hero-ico svg{width:20px;height:20px}
.hero h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hero .meta{font-size:13px;color:var(--text-muted);margin-top:4px}
.sect{padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.kpi{background:var(--surface-base);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--text-subtle)}
.pos{color:var(--ok)}.neg{color:var(--danger)}.wrn{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:var(--r-full);background:var(--surface-raised);color:var(--text-muted);font-size:12px;font-weight:500;border:0;white-space:nowrap}
.chip.p{background:var(--primary-soft);color:var(--primary)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--alert-bg);color:var(--danger)}
.chip.w{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row .sp{flex:1}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-subtle);cursor:pointer;user-select:none}
.switch input{appearance:none;width:34px;height:20px;border-radius:var(--r-full);background:var(--surface-raised);position:relative;cursor:pointer;transition:background .2s var(--ease);margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text-subtle);transition:transform .2s var(--ease),background .2s}
.switch input:checked{background:var(--primary-soft)}
.switch input:checked::after{transform:translateX(14px);background:var(--primary)}

/* chart */
.chart{background:var(--surface-base);border-radius:var(--r-lg);padding:12px 8px 4px}
.chart svg{width:100%;height:180px;display:block}

/* ledger */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);background:var(--surface-base)}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12px;font-weight:500;color:var(--text-muted);text-align:left;padding:10px 12px;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:10px 12px;font-size:14px;vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:var(--hover)}
tbody tr+tr td{border-top:1px solid rgba(128,128,128,.1)}
tr.done td.desc{color:var(--text-muted);text-decoration:line-through}
tr.est td.desc::after{content:" · estimado";color:var(--warn);font-size:12px;text-decoration:none;display:inline-block}
tr.off td{opacity:.55}
tr.today{box-shadow:inset 3px 0 0 var(--primary)}
.d-main{font-weight:500}
.d-sub{font-size:12px;color:var(--text-muted)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--text-muted);background:transparent;display:inline-flex;align-items:center;justify-content:center;padding:0;color:transparent}
.check.on{background:var(--ok);border-color:var(--ok);color:#06210f}
.check svg{width:14px;height:14px}
.month-row td{background:var(--surface-raised);font-size:12px;font-weight:600;color:var(--text-subtle);text-transform:uppercase;letter-spacing:.04em;padding:8px 12px;cursor:default}

/* debts */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.debt{background:var(--surface-base);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px}
.debt h4{margin:0;font-size:15px;font-weight:600}
.debt .amt{font-size:24px;font-weight:700;letter-spacing:-.02em}
.bar{height:6px;border-radius:var(--r-full);background:var(--surface-raised);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:var(--r-full);transition:width .4s var(--ease)}
.bar i.ok{background:var(--ok)}
.empty{padding:24px;text-align:center;color:var(--text-muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-base)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500}
.li .s{font-size:12px;color:var(--text-muted)}
.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-base);font-size:14px;line-height:1.4}
.todo input{margin-top:3px;accent-color:var(--primary)}
.todo input:checked+span{color:var(--text-muted);text-decoration:line-through}

/* fab + dialog */
.fab{position:fixed;right:20px;bottom:20px;z-index:20;height:48px;padding:0 20px;border-radius:var(--r-full);border:0;background:var(--text);color:var(--bg);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.fab svg{width:18px;height:18px}
dialog{border:0;padding:0;background:transparent;color:var(--text);max-width:440px;width:calc(100% - 32px);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
dialog .card{background:var(--surface-raised)}
dialog .input{background:var(--surface-base)}
dialog .hero{padding-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;padding:4px;background:var(--surface-base);border-radius:var(--r-lg)}
.seg button{flex:1;height:32px;border:0;border-radius:var(--r-md);background:transparent;color:var(--text-muted);font-weight:500;font-size:13px}
.seg button.on{background:var(--card);color:var(--text);font-weight:600}
.seg button.on.in{color:var(--ok)}.seg button.on.out{color:var(--danger)}
.actions{display:flex;gap:8px;margin-top:4px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-full);font-size:13px;font-weight:500;z-index:60;animation:rise .3s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{animation:toast .3s var(--ease)}
@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
/* ═════ Mobile first: o que vem abaixo é a base (celular); @media(min-width) devolve o layout largo ═════ */
.only-d{display:none}
.top{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.top .chip{font-size:11px;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
/* barra de abas fixa embaixo, no estilo iOS */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:9999;margin:0;gap:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-radius:0;overflow:visible;
  background:rgba(12,12,12,.88);-webkit-backdrop-filter:saturate(1.8) blur(20px);backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid rgba(255,255,255,.08)}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:50px;padding:0;font-size:10.5px;border-radius:var(--r-md)}
#tabs button svg{width:22px;height:22px}
#tabs button.on{background:transparent;color:var(--primary)}
.icon-btn{width:40px;height:40px}.icon-btn svg{width:18px;height:18px}
main{padding:4px 12px calc(150px + env(safe-area-inset-bottom));gap:12px}
.card{border-radius:var(--r-xl)}
.hero{padding:14px 14px 2px}.hero h2{font-size:20px}
.sect{padding:10px 14px 14px}
.kpis{grid-template-columns:1fr 1fr}.kpi{padding:12px}.kpi .v{font-size:20px}
.chart svg{height:150px}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.input{height:44px;font-size:16px}
.btn{height:48px;font-size:16px}.btn.sm{height:38px;font-size:14px}
.check{width:30px;height:30px}
.fab{right:16px;bottom:calc(74px + env(safe-area-inset-bottom));height:52px}
.toast{bottom:calc(140px + env(safe-area-inset-bottom));max-width:90vw}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* lista do calendário no celular */
.mlist{display:flex;flex-direction:column;gap:6px}
.mmonth{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 4px 2px}
.mrow{display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r-lg);background:var(--surface-base);cursor:pointer}
.mrow:active{background:var(--hover)}
.mrow.done .t{text-decoration:line-through;color:var(--text-muted)}
.mrow.off{opacity:.55}.mrow.today{box-shadow:inset 3px 0 0 var(--primary)}
.mrow .grow{flex:1;min-width:0}.mrow .t{font-weight:500;font-size:15px}
.mrow .s{font-size:12px;color:var(--text-muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mrow .amt{text-align:right;flex-shrink:0}.mrow .amt b{display:block;font-size:15px}.mrow .amt small{font-size:11px;color:var(--text-muted)}
/* diálogos viram "sheet" subindo de baixo */
dialog{position:fixed;inset:auto 0 0 0;margin:0;width:100%;max-width:none;background:var(--surface-raised);border-radius:var(--r-xl) var(--r-xl) 0 0;overflow:visible;box-shadow:0 -12px 48px rgba(0,0,0,.6)}
dialog .card{position:relative;border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom));background:var(--surface-raised);max-height:85dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
dialog::after, dialog .card::after{content:"";position:absolute;top:100%;left:0;right:0;height:120vh;background:var(--surface-raised);pointer-events:none}
dialog[open]{animation:sheet .3s var(--ease)}
html:has(dialog[open]), body:has(dialog[open]){overflow:hidden;overscroll-behavior:none}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sit{padding:12px 14px;border-radius:var(--r-lg);font-size:15px;line-height:1.45}
.sit.bad{background:var(--alert-bg)}.sit.bad b:first-child{color:var(--danger)}
.sit.ok{background:var(--ok-bg)}.sit.ok b:first-child{color:var(--ok)}
dialog .switch input{background:var(--surface-base)}
dialog .switch input:checked{background:var(--primary-soft)}
.auth{padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}

/* ═════ Visual de app de banco ═════ */
dialog .switch input{background:rgba(128,128,128,.34)}
.hello{display:flex;flex-direction:column;gap:2px;padding:4px 4px 0}
.hello small{font-size:13px;color:var(--text-muted)}
.hello h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.025em}
.wallet{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 58%,#a855f7 100%);color:#fff;border-radius:var(--r-xl);padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 14px 36px rgba(99,102,241,.28);animation:rise .4s var(--ease)}
.w-top{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:500;opacity:.92}
.eye{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.eye svg{width:18px;height:18px}
.w-val{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.w-pill{align-self:flex-start;font-size:13px;font-weight:600;padding:6px 12px;border-radius:var(--r-full);background:rgba(255,255,255,.2)}
.w-pill.bad{background:rgba(239,68,68,.92)}.w-pill.ok{background:rgba(52,209,124,.28)}
.w-row{display:flex;gap:10px;margin-top:4px}
.w-row>div{flex:1;min-width:0;background:rgba(255,255,255,.14);border-radius:var(--r-md);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.w-row small{font-size:11px;opacity:.85}.w-row b{font-size:17px;letter-spacing:-.01em}
body.oculto .num{filter:blur(9px)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.q{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--text);padding:4px 0}
.qi{width:58px;height:58px;border-radius:50%;background:var(--surface-raised);display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease),background .2s}
.qi svg{width:24px;height:24px}.q:active .qi{transform:scale(.92)}
.qi.out{color:var(--danger)}.qi.in{color:var(--ok)}
.sec-t{font-size:13px;font-weight:600;color:var(--text-muted);padding:2px 4px 6px}
.dia{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:capitalize;padding:12px 4px 6px}
.cal-movs{padding:0;display:flex;flex-direction:column;gap:8px}
.tlist{background:var(--surface-base);border-radius:var(--r-lg);overflow:hidden}
.swipe-row{position:relative;overflow:hidden;background:var(--surface-base);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.swipe-row+.swipe-row{border-top:1px solid rgba(128,128,128,.12)}
.swipe-act{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding:0 22px;z-index:1;color:#fff;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s ease}
.swipe-row.swiping .swipe-act{opacity:1}

function counted(e){ if (e.atrasar && !e.pago) return false; return !e.est || S.contarEstimados; }
function sorted(){ return [...S.events].sort((a,b) => a.date.localeCompare(b.date) || (a.tipo === b.tipo ? 0 : a.tipo === "in" ? -1 : 1)); }

function ledger(){
  let bal = Number(S.saldoInicial) || 0;
  return sorted().map(e => {
    const before = bal;
    if (counted(e)) bal += signed(e);
    return {e, before, after: bal, on: counted(e)};
  });
}
function saldoReal(){
  return (Number(S.saldoInicial) || 0) + S.events.filter(e => e.pago).reduce((s,e) => s + signed(e), 0);
}
function debtLeft(d){ return Math.max(0, d.valor - S.events.filter(e => e.pago && e.debt === d.id).reduce((s,e) => s + e.valor, 0)); }

/** Primeiro trecho em que o caixa fica negativo: quando começa, o pior momento, o quanto falta e quando volta ao positivo. */
function primeiroDeficit(L){
  const i = L.findIndex(r => r.on && r.after < 0); if (i < 0) return null;
  let pior = L[i], volta = null;
  for (let j = i; j < L.length; j++){
    if (!L[j].on) continue;
    if (L[j].after >= 0){ volta = L[j].e.date; break; }
    if (L[j].after < pior.after) pior = L[j];
  }
  return {inicio: L[i].e.date, piorDia: pior.e.date, falta: -pior.after, volta};
}

function chart(L){
  const pts = [{d:"2026-10-29", v:Number(S.saldoInicial) || 0}];
  L.forEach(r => { if (r.on) pts.push({d:r.e.date, v:r.after}); });
  const T = d => new Date(d).getTime(), t0 = T("2026-10-29"), t1 = T("2026-12-31");

  const W = 360, H = 180, pl = 8, pr = 8, pt = 22, pb = 24, span = (hi - lo) || 1;
  const x = d => pl + (T(d) - t0) / (t1 - t0) * (W - pl - pr);

  for (let i = 0; i <= N; i++){
    const t = t0 + (t1 - t0) * i / N; let v = pts[0].v;
    pts.forEach(p => { if (T(p.d) <= t) v = p.v; });
    samp.push(v);

  const sx = i => pl + i / N * (W - pl - pr), sy = v => y(Math.min(hi, Math.max(lo, v)));
  const P = sm.map((v, i) => [sx(i), sy(v)]);

  for (let i = 0; i < N; i++){
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(N, i + 2)];
    path += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;

  const rot = i => { const p = pts[i], k = Math.round((T(p.d) - t0) / (t1 - t0) * N), px = sx(k), py = P[k][1], tx = Math.min(Math.max(px, 40), W - 40), ty = Math.max(py - 14, 16);
    return `<rect x="${(px - 6).toFixed(1)}" y="${py.toFixed(1)}" width="12" height="${Math.max(0, base - py).toFixed(1)}" rx="2" fill="url(#cb)"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="8" fill="var(--accent)" opacity=".25"/><circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="4" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/><rect x="${(tx - 30).toFixed(1)}" y="${(ty - 14).toFixed(1)}" width="60" height="22" rx="11" fill="var(--accent)"/><text x="${tx.toFixed(1)}" y="${(ty + 1).toFixed(1)}" fill="var(--on-accent)" font-size="11" font-weight="700" text-anchor="middle">${kMil(p.v)}</text>`; };
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Como o saldo do caixa muda até 31 de dezembro">
    <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient><linearGradient id="cb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${meses}

    <path d="${area}" fill="url(#cg)" stroke="none"/>

function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

let justSwiped = false;
function initSwipeRows(container){
  container.querySelectorAll(".swipe-row[data-swipe-id]").forEach(row => {
    const evId = row.dataset.swipeId;
    if (!evId) return;
    const txEl = row.querySelector(".tx");
    const actEl = row.querySelector(".swipe-act");
    if (!txEl || !actEl) return;

    let startX = 0, startY = 0, currentX = 0, isDragging = false, isHorizontal = null;
    const threshold = 70;

    const onStart = (clientX, clientY) => {
      startX = clientX;
      startY = clientY;
      currentX = 0;
      isDragging = false;
      isHorizontal = null;
      row.classList.remove("swiping");
      txEl.classList.remove("swiping");
    };

    const onMove = (clientX, clientY, e) => {
      const dx = clientX - startX;
      const dy = clientY - startY;

      if (isHorizontal === null) {
        if (Math.abs(dx) > 7 || Math.abs(dy) > 7) {
          isHorizontal = Math.abs(dx) > Math.abs(dy);
        }
      }

      if (!isHorizontal) return;

      if (e && e.cancelable) e.preventDefault();
      isDragging = true;
      row.classList.add("swiping");
      txEl.classList.add("swiping");

      if (dx < 0) {
        currentX = dx < -140 ? -140 + (dx + 140) * 0.2 : dx;
        txEl.style.transform = `translateX(${currentX}px)`;
        actEl.classList.toggle("ready", Math.abs(currentX) >= threshold);
      } else {
        currentX = dx * 0.15;
        txEl.style.transform = `translateX(${currentX}px)`;
        actEl.classList.remove("ready");
      }
    };

    const onEnd = () => {
      if (!isDragging) {
        row.classList.remove("swiping");
        txEl.style.transform = "";
        return;
      }
      row.classList.remove("swiping");
      txEl.classList.remove("swiping");
      justSwiped = true;
      setTimeout(() => { justSwiped = false; }, 320);

      if (currentX <= -threshold) {
        txEl.style.transition = "transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)";
        txEl.style.transform = "translateX(-100%)";
        try { navigator.vibrate?.(25); } catch {}
        setTimeout(() => {
          const evItem = S.events.find(x => x.id === evId);
          if (evItem) {
            evItem.atrasar = !evItem.atrasar;
            save();
            render();
            toast(evItem.atrasar ? `"${evItem.desc}" marcada para atrasar. Saldo liberado!` : `"${evItem.desc}" reincluída no caixa.`);
          }
        }, 180);
      } else {
        txEl.style.transition = "transform 0.22s cubic-bezier(0.16, 1, 0.3, 1)";
        txEl.style.transform = "translateX(0px)";
        actEl.classList.remove("ready");
        setTimeout(() => { txEl.style.transition = ""; txEl.style.transform = ""; }, 240);
      }
      isDragging = false;
      isHorizontal = null;
    };

    row.addEventListener("touchstart", e => {
      if (e.touches.length === 1) onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    row.addEventListener("touchmove", e => {
      if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY, e);
    }, { passive: false });
    row.addEventListener("touchend", onEnd);
    row.addEventListener("touchcancel", onEnd);

    row.addEventListener("mousedown", e => {
      if (e.button !== 0 || e.target.closest("button")) return;
      onStart(e.clientX, e.clientY);
      const onMouseMove = ev => onMove(ev.clientX, ev.clientY, ev);
      const onMouseUp = () => {
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onMouseUp);
        onEnd();
      };
      window.addEventListener("mousemove", onMouseMove);
      window.addEventListener("mouseup", onMouseUp);
    });
  });
}

  if (!data.date || !data.desc || !data.valor) return;
  if (editing) Object.assign(editing, data);
  else {

      let [y,m,d] = data.date.split("-").map(Number);
      while (true){ m++; if (m > 12){ m = 1; y++; } if (y > 2026) break;
        const last = new Date(y, m, 0).getDate();
        S.events.push({id:uid(), ...data, pago:false, date:`${y}-${String(m).padStart(2,"0")}-${String(Math.min(d,last)).padStart(2,"0")}`}); }

        criadas++; m++; if (m > 12){ m = 1; y++; } }
      info().parcelamento = {valor:v, n, data:d}; },
    sum: () => { const p = info().parcelamento; return Math.round(p.n) + "x de " + brl(p.valor) + " a partir de " + fmtD(p.data); }
  },
  fat_dez: {
    t:"Faturas de dezembro", m:"Entram no calendário no vencimento de cada cartão",
    body: () => { const f = info().fatDez || {};
      return nField("tf_f_n","Nubank (vence dia 9)", f.nubank) + nField("tf_f_c","Cartão Caixa (vence dia 20)", f.caixa) + nField("tf_f_g","Cartão da Giovana (vence dia 13)", f.giovana)
        + '<span class="hint">Deixe em branco a fatura que ainda não conhece.</span>'; },
    save: () => { const f = {nubank:val("tf_f_n"), caixa:val("tf_f_c"), giovana:val("tf_f_g")};
      if (![f.nubank, f.caixa, f.giovana].some(has)) return "Informe ao menos uma fatura.";
      S.events = S.events.filter(e => !/^Fatura dez — /.test(e.desc));
      [["nubank","Nubank","09"],["caixa","cartão Caixa","20"],["giovana","cartão da Giovana","13"]].forEach(([k,n,dia]) => { if (has(f[k]) && f[k] > 0) S.events.push({id:uid(), date:"2026-12-"+dia, desc:"Fatura dez — " + n, tipo:"out", valor:f[k], cat:"Cartão", pago:false, est:false, debt:""}); });
      info().fatDez = f; },
    sum: () => { const f = info().fatDez; return ["nubank","caixa","giovana"].map(k => k[0].toUpperCase() + k.slice(1) + " " + (has(f[k]) ? brl0(f[k]) : "—")).join(" · "); }
  },
  treze_val: {
    t:"Valor líquido do 13º", m:"Substitui as estimativas de R$ 3.100",
    body: () => { const t = info().treze || {};
      return '<div class="two">' + nField("tf_t_j1","1ª parcela — você (R$)", t.j1) + nField("tf_t_g1","1ª parcela — Giovana (R$)", t.g1)
        + nField("tf_t_j2","2ª parcela — você (R$)", t.j2) + nField("tf_t_g2","2ª parcela — Giovana (R$)", t.g2) + '</div><span class="hint">Preencha os dois da mesma parcela para ela deixar de ser estimada. O valor líquido está no holerite ou no RH.</span>'; },
    save: () => { const t = {j1:val("tf_t_j1"), g1:val("tf_t_g1"), j2:val("tf_t_j2"), g2:val("tf_t_g2")}, nenhum = !Object.values(t).some(has);
      if (nenhum) return "Informe ao menos uma parcela.";
      [[1,t.j1,t.g1],[2,t.j2,t.g2]].forEach(([n,a,b]) => { const e = treze(n); if (e && (has(a) || has(b)) && has(a) && has(b)){ e.valor = a + b; e.est = false; trezeNome(e, n); } });
      if ((has(t.j1) !== has(t.g1)) || (has(t.j2) !== has(t.g2))) { info().treze = t; return "Preencha você E a Giovana na mesma parcela (as outras foram salvas)."; }
      info().treze = t; },
    sum: () => { const t = info().treze || {}, f = (a,b) => has(a) && has(b) ? brl0(a+b) : "estimada"; return "1ª " + f(t.j1,t.g1) + " · 2ª " + f(t.j2,t.g2); }
  },
  treze_dez: {
    t:"Datas do 13º", m:"Move as parcelas no calendário",
    body: () => dField("tf_td1","Crédito da 1ª parcela", (treze(1) || {}).date) + dField("tf_td2","Crédito da 2ª parcela", (treze(2) || {}).date),
    save: () => { const a = $("#tf_td1").value, b = $("#tf_td2").value; if (!a || !b) return "Informe as duas datas.";
      const e1 = treze(1), e2 = treze(2); if (e1) e1.date = a; if (e2) e2.date = b; if (e1) trezeNome(e1, 1); if (e2) trezeNome(e2, 2); },
    sum: () => "1ª em " + fmtD((treze(1) || {date:"0000-00-00"}).date) + " · 2ª em " + fmtD((treze(2) || {date:"0000-00-00"}).date)
  },
  parcial: {
    t:"Pagamento parcial (apto SP)", m:"O credor aceita pagar só uma parte da parcela?",
    body: () => sel("tf_pp","Resposta", [["sim","Sim, aceita parcial"],["nao","Não aceita: só integral"],["?","Ainda não sei"]], info().parcial || "?")
      + '<span class="hint">Se não aceitar, a parcela de R$ 500 fica vencida inteira até haver caixa para ela. O calendário já trata assim.</span>',
    save: () => { const v = $("#tf_pp").value; if (v === "?") return "Escolha sim ou não (ou feche e confirme depois)."; info().parcial = v; },
    sum: () => info().parcial === "sim" ? "Aceita pagamento parcial" : "Só aceita pagamento integral"
  }
};
function todoResumo(k){ try { return FORMS[k].sum(); } catch { return "Preenchido"; } }
function openTodo(k){
  todoKey = k; const f = FORMS[k];
  $("#tdTitle").textContent = f.t; $("#tdMeta").textContent = f.m; $("#tdBody").innerHTML = f.body();
  $("#tdErr").classList.add("hidden"); $("#tdClear").classList.toggle("hidden", !S.todos[k]); dT.showModal();
}
$("#tdCancel").onclick = () => dT.close();
$("#tdClear").onclick = () => { S.todos[todoKey] = false; save(); dT.close(); render(); };
$("#todoForm").onsubmit = ev => {
  ev.preventDefault();
  const erro = FORMS[todoKey].save();
  if (erro){ const el = $("#tdErr"); el.textContent = erro; el.classList.remove("hidden"); if (!/foram salvas/.test(erro)) return; }
  S.todos[todoKey] = true; save(); dT.close(); render(); toast("Salvo e calendário atualizado");
};
dT.addEventListener("click", e => { if (e.target === dT) dT.close(); });

/* Dívida */
const dd = $("#dlgDebt"); let editD = null;
function openDebt(id){
  editD = id ? S.debts.find(d => d.id === id) : null;
  const d = editD || {nome:"", valor:"", grupo:"outro", nota:""};
  $("#dbTitle").textContent = editD ? "Editar dívida" : "Nova dívida";
  $("#dbNome").value = d.nome; $("#dbValor").value = d.valor; $("#dbGrupo").value = d.grupo; $("#dbNota").value = d.nota || "";
  $("#dbDel").classList.toggle("hidden", !editD); dd.showModal();
}
$("#dbCancel").onclick = () => dd.close();
$("#dbDel").onclick = () => { if (!confirm("Excluir esta dívida? Os pagamentos ligados a ela ficam no calendário.")) return; S.events.forEach(e => { if (e.debt === editD.id) e.debt = ""; }); S.debts = S.debts.filter(d => d !== editD); save(); dd.close(); render(); };
$("#debtForm").onsubmit = ev => {
  ev.preventDefault();
  const data = {nome:$("#dbNome").value.trim(), valor:parseFloat($("#dbValor").value) || 0, grupo:$("#dbGrupo").value, nota:$("#dbNota").value.trim()};
  if (editD) Object.assign(editD, data); else S.debts.push({id:uid(), ...data});
  save(); dd.close(); render();
};
[dlg, dd].forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));

/* Abas e tema */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); window.scrollTo({top:0}); });
function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem(THEMEKEY, t); } catch {} $('meta[name="theme-color"]').content = t === "light" ? "#f4f4f5" : "#000000"; }
try { setTheme(localStorage.getItem(THEMEKEY) || "dark"); } catch {}
$("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

/* ═════════════ Banco de dados (Supabase via REST, sem SDK) ═════════════ */
async function api(path, {method = "GET", body, auth = true, headers = {}} = {}){
  const h = {apikey: CLOUD.anonKey, "Content-Type": "application/json", ...headers};
  if (auth && sess) h.Authorization = "Bearer " + sess.access_token;
  const r = await fetch(CLOUD.url.replace(/\/$/, "") + path, {method, headers: h, body: body ? JSON.stringify(body) : undefined});
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok){ const e = new Error((j && (j.msg || j.error_description || j.message || j.error)) || ("Erro " + r.status)); e.status = r.status; throw e; }
  return j;
}
function setSess(s){ sess = s; try { s ? localStorage.setItem(SESSKEY, JSON.stringify(s)) : localStorage.removeItem(SESSKEY); } catch {} }
function guardaTokens(j){ setSess({access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + (j.expires_in || 3600) * 1000, user:{id:j.user.id, email:j.user.email}}); }
async function renova(){
  if (!sess) return false;
  try { guardaTokens(await api("/auth/v1/token?grant_type=refresh_token", {method:"POST", auth:false, body:{refresh_token:sess.refresh_token}})); return true; }
  catch (e){ if (e.status === 400 || e.status === 401) setSess(null); return false; }
}
async function garante(){ if (sess && sess.expires_at - Date.now() < 60000) return renova(); return !!sess; }

const syncChip = (t, c) => { const el = $("#syncChip"); el.textContent = t; el.className = "chip " + (c || ""); };
let pushT = null, pushing = false, sujo = false;
function agendaPush(){
  if (!nuvem() || !sess) return;
  sujo = true; syncChip("Salvando…", "w"); clearTimeout(pushT); pushT = setTimeout(push, 700);
}
/** Grava o estado inteiro na linha do usuário (upsert). Se falhar, o dado segue salvo no aparelho e tenta de novo. */
async function push(){
  if (pushing){ pushT = setTimeout(push, 700); return; }
  pushing = true;
  try {
    if (!await garante()) throw new Error("sessão expirada");
    const ts = (S._ts ||= Date.now());
    await api("/rest/v1/caixa_state", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:{user_id:sess.user.id, data:S, updated_at:new Date(ts).toISOString()}});
    if (S._ts === ts) sujo = false;
    syncChip(sujo ? "Salvando…" : "Sincronizado", sujo ? "w" : "ok");
  } catch (e){
    if (!sess){ syncChip("Entre de novo", "bad"); return; }
    syncChip("Sem conexão · salvo no aparelho", "bad"); pushT = setTimeout(push, 15000);
  } finally { pushing = false; }
}
/** Busca a versão da nuvem; a mais recente (por _ts) vence. */
async function pull(){
  if (!nuvem() || !sess || sujo) return;
  try {
    if (!await garante()) return;
    const r = await api("/rest/v1/caixa_state?select=data&user_id=eq." + sess.user.id), remoto = r && r[0] && r[0].data;
    if (!remoto){ S._ts ||= Date.now(); agendaPush(); return; }
    if ((remoto._ts || 0) > (S._ts || 0)){ S = remoto; S.todos ||= {}; try { localStorage.setItem(dataKey(), JSON.stringify(S)); } catch {} render(); syncChip("Sincronizado", "ok"); }
    else if ((remoto._ts || 0) < (S._ts || 0)) agendaPush();
    else syncChip("Sincronizado", "ok");
  } catch { syncChip("Sem conexão · salvo no aparelho", "bad"); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });

/* ═════════════ Acesso ═════════════
   Com banco configurado: login por e-mail e senha (Supabase Auth). Sem banco: senha local simples
   (só barra quem pegar o aparelho; não é criptografia). */
function hash(s){ let h = 5381; for (const c of "caixa|" + s) h = ((h << 5) + h + c.charCodeAt(0)) | 0; return String(h); }
const hasPin = () => { try { const v = localStorage.getItem(PINKEY); return !!v && v !== "none"; } catch { return false; } };
const semSenha = () => { try { return localStorage.getItem(PINKEY) === "none"; } catch { return false; } };
const unlocked = () => { try { return sessionStorage.getItem("caixa.ok") === "1"; } catch { return false; } };
try { if (localStorage.getItem("caixa.oculto") === "1") document.body.classList.add("oculto"); } catch {}
let modo = "in";
function enter(){
  try { sessionStorage.setItem("caixa.ok","1"); } catch {}
  $("#auth").classList.add("hidden"); $("#app").classList.remove("hidden");
  if (!AUTH_ENABLED){
    $("#lockBtn").classList.add("hidden");
    syncChip("Modo livre (sem login)", "");
  } else if (nuvem()){
    $("#lockBtn").title = "Sair";
    syncChip("Conectando…", "w");
  } else {
    syncChip("Só neste aparelho", "w");
  }
  render();
  if (nuvem() && sess) pull();
}
function setModo(m){
  modo = m;
  document.querySelectorAll("#authTabs button").forEach(b => b.classList.toggle("on", b.dataset.m === m));
  $("#authTitle").textContent = m === "in" ? "Entrar" : "Criar conta";
  $("#authBtn").textContent = m === "in" ? "Entrar" : "Criar conta";
  $("#authHint").textContent = m === "up" ? "Mínimo de 6 caracteres. Use a mesma conta no celular e no computador." : "";
  $("#authPin").autocomplete = m === "in" ? "current-password" : "new-password";
  $("#authErr").classList.add("hidden");
}
document.querySelectorAll("#authTabs button").forEach(b => b.onclick = () => setModo(b.dataset.m));
function lock(){
  if (!AUTH_ENABLED){ enter(); return; }
  try { sessionStorage.removeItem("caixa.ok"); } catch {}
  $("#app").classList.add("hidden"); $("#auth").classList.remove("hidden");
  $("#authErr").classList.add("hidden"); $("#authPin").value = "";
  if (nuvem()){
    $("#authTabs").classList.remove("hidden"); $("#authEmailF").classList.remove("hidden"); $("#authSkip").classList.add("hidden");
    $("#authMeta").textContent = "Seus dados ficam salvos na sua conta";
    $("#authLbl").textContent = "Senha"; setModo(modo); $("#authEmail").focus(); return;
  }
  const first = !hasPin();
  $("#authTitle").textContent = first ? "Criar senha" : "Entrar";
  $("#authLbl").textContent = first ? "Nova senha" : "Senha";
  $("#authBtn").textContent = first ? "Criar e entrar" : "Entrar";
  $("#authHint").textContent = first ? "Barra quem pegar seu aparelho. Os dados ficam só neste navegador." : "";
  $("#authSkip").classList.toggle("hidden", !first); $("#authPin").focus();
}
function showErr(t){ const el = $("#authErr"); el.textContent = t; el.classList.remove("hidden"); }
$("#authForm").onsubmit = async e => {
  e.preventDefault();
  const p = $("#authPin").value;
  if (nuvem()){
    const email = $("#authEmail").value.trim();
    if (!email || p.length < 6){ showErr("Informe o e-mail e uma senha de ao menos 6 caracteres."); return; }
    const btn = $("#authBtn"); btn.disabled = true;
    try {
      const j = await api(modo === "in" ? "/auth/v1/token?grant_type=password" : "/auth/v1/signup", {method:"POST", auth:false, body:{email, password:p}});
      if (!j.access_token){ showErr("Conta criada. Confirme o e-mail que você recebeu e depois entre."); setModo("in"); return; }
      guardaTokens(j); load(); enter();
    } catch (err){
      const m = String(err.message);
      showErr(/invalid login/i.test(m) ? "E-mail ou senha incorretos." : /already|registered/i.test(m) ? "Esse e-mail já tem conta. Use Entrar." : /confirm/i.test(m) ? "Confirme o e-mail antes de entrar." : /fetch|network/i.test(m) ? "Sem conexão com o banco." : m);
    } finally { btn.disabled = false; }
    return;
  }
  if (!hasPin()){ if (p.length < 4){ showErr("Use ao menos 4 caracteres."); return; } try { localStorage.setItem(PINKEY, hash(p)); } catch {} enter(); return; }
  let ok = false; try { ok = localStorage.getItem(PINKEY) === hash(p); } catch {}
  ok ? enter() : showErr("Senha incorreta.");
};
$("#authSkip").onclick = () => { try { localStorage.setItem(PINKEY, "none"); } catch {} enter(); };
$("#lockBtn").onclick = () => { if (nuvem()){ setSess(null); try { sessionStorage.removeItem("caixa.ok"); } catch {} location.reload(); } else lock(); };

if (!AUTH_ENABLED){
  enter();
} else if (nuvem()){
  if (sess){ renova().then(ok => { if (!ok && !sess) lock(); }); enter(); } else lock();
} else if (unlocked() || semSenha()){
  enter();
} else {
  lock();
}
</script>
